# Test values for Gateway API with advanced routing rules
server:
  workers: 1

gateway:
  enabled: true
  annotations:
    example.com/annotation: "test"
  parentRefs:
    - name: trino-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - trino.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui
        - headers:
            - name: X-Custom-Header
              value: custom-value
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
    - matches:
        - path:
            type: PathPrefix
            value: /
